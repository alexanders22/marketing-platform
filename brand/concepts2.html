<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f4f3f1;color:#0b0b0f}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:32px}
  .card{background:#fff;border-radius:20px;padding:28px}
  .dark{background:#09090b;color:#fafafa;border-radius:14px;padding:22px;margin-top:16px;display:flex;align-items:center;gap:12px}
  .light{display:flex;align-items:center;gap:12px}
  .word{font-weight:800;font-size:30px;letter-spacing:-.035em}
  .word b{background:linear-gradient(90deg,#ff6a00,#ff2e63);-webkit-background-clip:text;color:transparent}
  h3{margin:0 0 18px;font-size:13px;color:#71717a;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .row{display:flex;gap:14px;align-items:center;margin-top:18px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ff6a00"/><stop offset=".55" stop-color="#ff2e63"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  <!-- B2: white paper plane on gradient, sound waves trailing behind -->
  <symbol id="B2" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="16" fill="url(#g)"/>
    <path d="M22 31 L51 14 L43 47 L35 37 Z" fill="#fff"/>
    <path d="M35 37 L51 14 L31 34 Z" fill="#000" opacity=".14"/>
    <path d="M25 41 a 8 8 0 0 0 -3 10" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M18 37 a 15 15 0 0 0 -5 17" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" opacity=".55"/>
  </symbol>
  <!-- C2: polished Loud L -->
  <symbol id="C2" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="16" fill="url(#g)"/>
    <path d="M19 15 V45 H32" fill="none" stroke="#fff" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38.5 23 a 11 11 0 0 1 0 15" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M45.5 16.5 a 20 20 0 0 1 0 28" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round" opacity=".6"/>
  </symbol>
  <!-- D: hybrid — the L's foot becomes a plane's flight path with waves above -->
  <symbol id="D" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="16" fill="#0b0b0f"/>
    <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
    <path d="M19 15 V45 H32" fill="none" stroke="url(#g)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38.5 23 a 11 11 0 0 1 0 15" fill="none" stroke="#ff2e63" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M45.5 16.5 a 20 20 0 0 1 0 28" fill="none" stroke="#8b5cf6" stroke-width="4.6" stroke-linecap="round"/>
  </symbol>
</defs></svg>
<div class="grid">
  <div class="card"><h3>B2 · Paper plane + waves</h3>
    <div class="light"><svg width="56" height="56"><use href="#B2"/></svg><span class="word">loud<b>pilot</b></span></div>
    <div class="dark"><svg width="44" height="44"><use href="#B2"/></svg><span class="word" style="font-size:24px">loud<b>pilot</b></span></div>
    <div class="row"><svg width="32" height="32"><use href="#B2"/></svg><svg width="20" height="20"><use href="#B2"/></svg><svg width="16" height="16"><use href="#B2"/></svg></div></div>
  <div class="card"><h3>C2 · Loud L (gradient)</h3>
    <div class="light"><svg width="56" height="56"><use href="#C2"/></svg><span class="word">loud<b>pilot</b></span></div>
    <div class="dark"><svg width="44" height="44"><use href="#C2"/></svg><span class="word" style="font-size:24px">loud<b>pilot</b></span></div>
    <div class="row"><svg width="32" height="32"><use href="#C2"/></svg><svg width="20" height="20"><use href="#C2"/></svg><svg width="16" height="16"><use href="#C2"/></svg></div></div>
  <div class="card"><h3>D · Loud L (dark)</h3>
    <div class="light"><svg width="56" height="56"><use href="#D"/></svg><span class="word">loud<b>pilot</b></span></div>
    <div class="dark"><svg width="44" height="44"><use href="#D"/></svg><span class="word" style="font-size:24px">loud<b>pilot</b></span></div>
    <div class="row"><svg width="32" height="32"><use href="#D"/></svg><svg width="20" height="20"><use href="#D"/></svg><svg width="16" height="16"><use href="#D"/></svg></div></div>
</div></body></html>
